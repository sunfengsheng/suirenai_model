services:
  model-market:
    build: .
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:3080:80"
    environment:
      - API_BASE_URL=${API_BASE_URL:-https://api.suirenai.com}
    volumes:
      - ./public/config.json:/usr/share/nginx/html/config.json:ro
      - ./public/pricing.json:/usr/share/nginx/html/pricing.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
