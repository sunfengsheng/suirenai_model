services:
  model-market:
    build: .
    ports:
      - "80:80"
    environment:
      - API_BASE_URL=${API_BASE_URL:-https://api.suirenai.com}
      - PROXY_KEY_0=${PROXY_KEY_0}
      - PROXY_KEY_1=${PROXY_KEY_1}
      - PROXY_KEY_2=${PROXY_KEY_2}
      - PROXY_KEY_3=${PROXY_KEY_3}
    volumes:
      - ./public/config.json:/usr/share/nginx/html/config.json:ro
      - ./public/pricing.json:/usr/share/nginx/html/pricing.json:ro
    restart: unless-stopped
